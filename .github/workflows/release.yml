name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  # pyproject.toml configures an Aliyun mirror as the default index for the
  # maintainer's network. GitHub-hosted runners use upstream PyPI instead.
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run --no-sync ruff check src/ tests/ scripts/

      - name: Mypy
        run: uv run --no-sync mypy src/ scripts/

      - name: Modularity ratchet (bylaw §5.1)
        run: uv run --no-sync python scripts/check_modularity.py

      - name: Run tests
        run: uv run --no-sync pytest -q

  build:
    name: Build package
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/symkit-mcp
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/symkit-mcp
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

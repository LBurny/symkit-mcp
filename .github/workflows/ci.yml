name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pyproject.toml configures an Aliyun mirror as the default index for the
  # maintainer's network. GitHub-hosted runners use upstream PyPI instead.
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  quality:
    name: Lint, types, modularity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run --no-sync ruff check src/ tests/ scripts/

      - name: Mypy
        run: uv run --no-sync mypy src/ scripts/

      - name: Modularity ratchet (bylaw §5.1)
        run: uv run --no-sync python scripts/check_modularity.py --report

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep this matrix in step with `.github/workflows/release.yml`, whose
        # quality gate must cover the same interpreters before it can publish.
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run --no-sync pytest
